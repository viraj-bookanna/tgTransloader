[project]
name = "tgtransloader"
version = "0.2.0"
description = "Telegram bot that transloads, converts, extracts, and manages files, with a pluggable per-site downloader system."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "telethon>=1.36",
    "pillow",
    "cryptg",
    "hachoir",
    "pysocks",
    "rarfile",
    "py7zr",
    "aiohttp>=3.9",
    "aiofiles",
    "multivolumefile",
    "thumb-gen",
    "python-dotenv",
    "mslex",
    "websockets",
    "beautifulsoup4",
]

[project.scripts]
tgtransloader = "tgtransloader.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tgtransloader"]

[tool.hatch.build.targets.sdist]
include = ["src/tgtransloader", "plugins", "README.md", "LICENSE"]
